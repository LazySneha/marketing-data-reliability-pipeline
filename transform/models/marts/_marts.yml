version: 2

models:
  - name: dim_campaigns
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
      - name: platform
        data_tests: [not_null]

  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: fct_orders
    description: One row per order with refunds rolled up and last-click attribution. Source of truth for revenue.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: attributed_platform
        data_tests:
          - accepted_values:
              arguments:
                values: ['meta', 'google', 'direct', 'unmapped']
      - name: net_revenue
        data_tests: [not_null]

  - name: fct_refunds
    columns:
      - name: refund_id
        data_tests: [unique, not_null]

  - name: fct_ad_spend_daily
    description: Incremental. Each run rebuilds the last ad_spend_lookback_days days to absorb restatements.
    columns:
      - name: ad_spend_id
        data_tests: [unique, not_null]

  - name: mart_marketing_daily
    description: Brand x day spend, revenue and blended efficiency metrics.
    columns:
      - name: report_date
        data_tests: [unique, not_null]
      - name: mer
        description: Net revenue / total ad spend (blended). NULL when there is no spend.
      - name: aov
        description: Gross revenue / orders.
      - name: new_customer_cac
        description: Total ad spend / customers placing their first order that day.

  - name: mart_campaign_daily
    description: Platform x campaign x day with internal last-click ROAS next to platform-reported ROAS.
    data_tests:
      - unique:
          arguments:
            column_name: "report_date || '|' || platform || '|' || campaign_id"

  - name: fct_order_items
    description: One row per order line, with the order-level discount allocated by line subtotal.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: sku
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: sku
      - name: line_gross_revenue
        data_tests: [not_null]

  - name: fct_inventory_daily
    description: One row per SKU x date with velocity, days of cover and open replenishment.
    data_tests:
      - unique:
          arguments:
            column_name: "sku || '|' || snapshot_date"
    columns:
      - name: sku
        data_tests: [not_null]
      - name: on_hand
        data_tests: [not_null]

  - name: mart_spend_at_risk
    description: Campaign x SKU x day where spend is exposed to a stockout. Campaign spend is split evenly across the SKUs it promotes.
    data_tests:
      - unique:
          arguments:
            column_name: "report_date || '|' || campaign_id || '|' || sku"
    columns:
      - name: risk_reason
        data_tests:
          - accepted_values:
              arguments:
                values: ['spend_on_out_of_stock_sku', 'stockout_before_restock', 'stockout_with_no_restock_due']

  - name: mart_alerts
    description: One row per alert, read by alerts/digest.py. Every rule has a minimum-volume guard.
    data_tests:
      - unique:
          arguments:
            column_name: "alert_date || '|' || alert_type || '|' || entity_id"
    columns:
      - name: alert_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['stockout_risk_with_active_spend', 'spend_on_out_of_stock_sku', 'mer_drop', 'cac_spike']
      - name: severity
        data_tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium']
      - name: message
        data_tests: [not_null]
